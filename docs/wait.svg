<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Rajdhani, system-ui, -apple-system, Segoe UI, sans-serif">
<style>@font-face { font-family: "Rajdhani"; font-weight: 600; src: url("src/fonts/rajdhani-600.woff2") format("woff2"); }@font-face { font-family: "Rajdhani"; font-weight: 700; src: url("src/fonts/rajdhani-700.woff2") format("woff2"); }</style>
<rect width="760" height="380" fill="#0a0a12"/>
<text x="38" y="32" font-size="17" font-weight="600" fill="#e8e8f0">How long the others wait for the one that computes</text>
<line x1="262.0" y1="62" x2="262.0" y2="316" stroke="#1c1c2a" stroke-width="1"/>
<text x="262.0" y="336" font-size="11" fill="#8b8ba7" text-anchor="middle">0</text>
<line x1="453.7" y1="62" x2="453.7" y2="316" stroke="#1c1c2a" stroke-width="1"/>
<text x="453.7" y="336" font-size="11" fill="#8b8ba7" text-anchor="middle">50</text>
<line x1="645.3" y1="62" x2="645.3" y2="316" stroke="#1c1c2a" stroke-width="1"/>
<text x="645.3" y="336" font-size="11" fill="#8b8ba7" text-anchor="middle">100</text>
<rect x="262" y="86.8" width="15.3" height="28.0" rx="3" fill="#3ddc97"/>
<text x="250" y="105.8" font-size="13" font-weight="600" fill="#3ddc97" text-anchor="end">MemoLock</text>
<text x="285.3" y="105.8" font-size="13" font-weight="700" fill="#3ddc97">4 ms</text>
<rect x="262" y="148.2" width="26.8" height="28.0" rx="3" fill="#3ddc97"/>
<text x="250" y="167.2" font-size="13" font-weight="600" fill="#3ddc97" text-anchor="end">FleetLock on PubSubRedisStore</text>
<text x="296.8" y="167.2" font-size="13" font-weight="700" fill="#3ddc97">7 ms</text>
<rect x="262" y="209.8" width="387.2" height="28.0" rx="3" fill="#ff6b6b"/>
<text x="250" y="228.8" font-size="13" font-weight="600" fill="#ff6b6b" text-anchor="end">LockRegistry</text>
<text x="657.2" y="228.8" font-size="13" font-weight="700" fill="#ff6b6b">101 ms</text>
<rect x="262" y="271.2" width="414.0" height="28.0" rx="3" fill="#ff6b6b"/>
<text x="250" y="290.2" font-size="13" font-weight="600" fill="#ff6b6b" text-anchor="end">FleetLock on RedisStore</text>
<text x="684.0" y="290.2" font-size="13" font-weight="700" fill="#ff6b6b">108 ms</text>
<text x="469.0" y="364" font-size="11.5" fill="#8b8ba7" text-anchor="middle">milliseconds beyond the 300 ms computation, twelve requests for one cold key</text>
