<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>artigo — organisation avatar</title>
<style>
@font-face { font-family: 'Rajdhani'; font-weight: 700; src: url('fonts/rajdhani-700.woff2') format('woff2'); }

:root
{
	--bg: #0a0a12;
	--mint: #3ddc97;
	--display: 'Rajdhani', 'Segoe UI', sans-serif;
}

*
{
	box-sizing: border-box;
}

body
{
	margin: 0;
	background: #000;
	overflow: hidden;
}

.mark
{
	position: relative;
	width: 460px;
	height: 460px;
	overflow: hidden;
	background: var(--bg);
	font-family: var(--display);
}

/* the same grid the plates carry, which at avatar sizes reads as texture */
.mark::before
{
	content: '';
	position: absolute;
	inset: 0;
	background-image:
		linear-gradient(rgba(61, 220, 151, 0.05) 1px, transparent 1px),
		linear-gradient(90deg, rgba(61, 220, 151, 0.05) 1px, transparent 1px);
	background-size: 44px 44px, 44px 44px;
}

.mark::after
{
	content: '';
	position: absolute;
	inset: 0;
	background:
		radial-gradient(120% 120% at 80% 40%, rgba(61, 220, 151, 0.10), transparent 62%),
		radial-gradient(80% 90% at 6% 10%, rgba(232, 232, 240, 0.04), transparent 60%);
}

.glyph
{
	position: absolute;
	z-index: 2;
	inset: 0;
	display: flex;
	align-items: center;
	justify-content: center;
	font-size: 470px;
	font-weight: 700;
	line-height: 1;
	letter-spacing: 0;
	/* Rajdhani's 'a' sits low in its box; this centres it optically */
	transform: translateY(-3%);
	color: var(--mint);
	text-shadow: 0 0 60px rgba(61, 220, 151, 0.40);
}
</style>
</head>
<body>

<div class="mark">
	<div class="glyph">a</div>
</div>

</body>
</html>
